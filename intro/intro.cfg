# ld65 layout for the loading screens program: one PRG from $0801 (BASIC stub, SYS 2064). Its text pages are shown in VIC
# bank 0 (screen $0400, character set $3800, built at run time), the picture in bank 3 ($E000 bitmap, $CC00 screen), so
# everything in the file must end below $3800, and the game's file (which loads over all of it) leaves bank 3 alone.
MEMORY {
    LOADADDR: file = %O, start = $07ff, size = 2;
    MAIN:     file = %O, start = $0801, size = $3000;
}
SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    STUB:     load = MAIN, type = ro, start = $0801;
    CODE:     load = MAIN, type = ro, start = $0810;
    RODATA:   load = MAIN, type = ro;
}
