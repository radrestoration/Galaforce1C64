FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:     type = import;
    __EXEHDR__:       type = import;
    __STACKSIZE__:    type = weak,   value = $0800; # 2k stack
    __HIMEM__:        type = weak,   value = $9F00;
}
# C64 character mode uses screen RAM at $0400 and charset RAM at $2000.
# A future bitmap star layer must reserve bitmap-visible memory separately.
MEMORY {
    ZP:       file = "", define = yes, start = $0022,                size = $0080 - $0022;
    ZP2:      file = "", define = yes, start = $00A9,                size = $00FF - $00A9;
    LOADADDR: file = %O,               start = %S - 2,               size = $0002;
    HEADER:   file = %O, define = yes, start = %S,                   size = $000D;
    # Code and data must end below $4000: VIC bank 1 ($4000-$7FFF) is the screen matrix, the sprites and the bitmap.
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__,      size = $4000 - __HEADER_LAST__, fill = yes;
    MATRIX:   file = %O,               start = $4000,                size = $0400, fill = yes;
    # the rest of VIC bank 1 above the screen matrix: sprite shapes, their tables, the star arrays; then variables
    SPRD:     file = %O,               start = $4400,                size = $0800;
    SPRVAR:   file = "",               start = $4C00,                size = $0300;
    BSS:      file = "",               start = __ONCE_RUN__,         size = $4000 - __ONCE_RUN__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    ZP2:      load = ZP2,      type = zp,                optional = yes;
    EXTZP:    load = ZP,       type = zp,                optional = yes;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    STARTUP:  load = MAIN,     type = ro;
    LOWCODE:  load = MAIN,     type = ro,                optional = yes;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    INIT:     load = MAIN,     type = rw;
    ONCE:     load = MAIN,     type = ro,  define = yes;
    BSS:      load = BSS,      type = bss, define = yes;
    SPRITES:  load = SPRD,     type = ro;
    SPRTAB:   load = SPRD,     type = ro;
    STARARR:  load = SPRD,     type = rw;
    SPRVAR:   load = SPRVAR,   type = bss;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
