# Sprite multiplexer test: one PRG laid out so the VIC-II bank 1 ($4000-$7FFF) holds the screen matrix, the
# sprite shapes and the bitmap, with the code below it and the recorded alien positions above it.
SYMBOLS {
    __LOADADDR__: type = import;
    __EXEHDR__:   type = import;
}
MEMORY {
    ZP:       file = "",         start = $0022, size = $0070;
    LOADADDR: file = %O,         start = $07FF, size = $0002;
    HEADER:   file = %O,         start = $0801, size = $000D;
    MAIN:     file = %O,         start = $080D, size = $4400 - $080D, fill = yes;
    SPR:      file = %O,         start = $4400, size = $0C00,         fill = yes;
    BMP:      file = %O,         start = $5000, size = $3000,         fill = yes;
    REPLAY:   file = %O,         start = $8000, size = $5000;
    BSS:      file = "",         start = $0400, size = $0400;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    SPRITES:  load = SPR,      type = ro;
    REPLAY:   load = REPLAY,   type = ro;
    BSS:      load = BSS,      type = bss;
}
